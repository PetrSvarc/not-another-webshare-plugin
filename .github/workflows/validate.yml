name: Validate Kodi add-on

on:
  push:
    branches:
      - main
      - modernize-webshare-api
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"

      - name: Compile Python sources
        run: python -m compileall -q main.py yawsp.py webshare_api.py series_manager.py md5crypt.py tests

      - name: Run API client tests
        run: python -m unittest discover -s tests -v
